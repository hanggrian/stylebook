[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stylebook"
version = "0.3.2"
description = "Comprehensive linter aggregator for data and tooling formats"
keywords = [
  "sql",
  "toml",
  "yaml",
  "lint",
  "linter",
]
authors = [{ name = "Hendra Anggrian", email = "hanggrian@proton.me" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  # main
  "colorama",
  "PyYAML==6.0.3"
]

[project.optional-dependencies]
ansible-lint = ["ansible-lint==26.10.1", "ansible-core==2.22.0rc1; python_version >= '3.15'"]
# Direct VSC dependency is not supported by hatchling
# asciidoc-linter = ["asciidoc-linter @ git+https://github.com/docToolchain/asciidoc-linter.git"]
blinter = ["Blinter==1.1.43"]
cfn-lint = ["cfn-lint==1.59.0; python_version < '3.15'"]
dotenv-linter = ["dotenv-linter==0.9.0"]
pyinilint = ["pyinilint==0.17"]
restructuredtext-lint = ["restructuredtext-lint==2.0.2"]
sqlfluff = ["sqlfluff==4.4.0"]
taplo = ["taplo==0.9.3"]
yamllint = ["yamllint==1.38.0"]

[project.urls]
"Source Code" = "https://github.com/hanggrian/stylebook"
"Bug Tracker" = "https://github.com/hanggrian/stylebook/issues"

[project.scripts]
stylebook = "stylebook.main:run"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["stylebook"]

[tool.hatch.build.targets.sdist]
include = ["stylebook/"]
